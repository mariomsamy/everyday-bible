name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App typecheck and build
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Server tests
        run: npm test
      - name: Dependency audit (production dependencies)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image builds
        run: docker build -t everyday-bible-ci .
