<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d2027; --muted:#6a6f7c; --line:#e4e1db; --accent:#2c4a8f; --ok:#2e7d4f; --bad:#b4443a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --card:#1d2027; --fg:#e4e6eb; --muted:#9097a5; --line:#2b2f38; --accent:#7ea0f0; } }
  * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif; }
  header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; }
  h1 { font-size:18px; margin:0; } main { max-width:1100px; margin:0 auto; padding:20px; display:grid; gap:16px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; } .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .big { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; } .sub { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; } td { padding:4px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:end; font-variant-numeric:tabular-nums; color:var(--muted); }
  .bars { display:flex; align-items:flex-end; gap:2px; height:110px; } .bars i { flex:1; background:var(--accent); min-height:2px; border-radius:2px 2px 0 0; opacity:.85; }
  .hbar { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:13px; } .hbar b { flex:none; width:90px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar span { flex:1; height:10px; background:var(--line); border-radius:5px; overflow:hidden; } .hbar span i { display:block; height:100%; background:var(--accent); } .hbar em { font-style:normal; width:44px; text-align:end; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; border:1px solid var(--line); margin-inline-end:6px; } .pill.on { color:var(--ok); border-color:var(--ok); } .pill.off { color:var(--muted); }
  form { display:flex; gap:8px; } input, select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); } button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); } .tabs button { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent; border-radius:0; padding:10px 14px; } .tabs button.on { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  .form { display:grid; gap:14px; max-width:720px; } .fld { display:grid; gap:4px; font-size:14px; } .fld small { color:var(--muted); } .fld input, .fld select, .fld textarea { width:100%; } textarea { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .chk { display:flex; gap:10px; align-items:center; } .chk input { width:20px; height:20px; } .row2 { align-items:end; display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); } .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } h3 { font-size:14px; margin:6px 0 0; }
  button.ghost { background:transparent; color:var(--fg); } button.danger { background:var(--bad); border-color:var(--bad); } .note { margin:0; padding:8px 12px; border-radius:8px; border:1px solid var(--line); font-size:14px; } .note.ok { color:var(--ok); border-color:var(--ok); } .note.bad { color:var(--bad); border-color:var(--bad); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; } [hidden] { display:none !important; }
  #login { max-width:420px; margin:80px auto; } .err { color:var(--bad); }
</style>
</head>
<body>
<header><h1>Bible app — admin</h1><span class="sub" id="gen"></span><button id="out" hidden>Sign out</button></header>
<main id="app">
  <div id="login" class="card">
    <h2>Admin token</h2>
    <form id="f"><input id="tok" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" required style="flex:1"><button>Open</button></form>
    <p class="err" id="err"></p>
    <p class="sub">The token is kept in memory only, never stored in the browser and never put in the URL.</p>
  </div>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
