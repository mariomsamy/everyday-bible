    <style>
      /* Splash: lives in the HTML to show before the JavaScript loads. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #1d2027; background: #faf9f7; transition: opacity 0.3s ease; }
      :root[data-theme='sepia'] #splash { background: #f3ead8; color: #3a2f22; }
      :root[data-theme='dark'] #splash { background: #14161b; color: #e4e6eb; }
      #splash small { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 500 13px/1 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; opacity: 0.35; }
      #splash span { font: 700 26px/1 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
      .no-splash #splash { display: none; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 96px; height: 96px; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt="" width="96" height="96" /><span>الكتاب المقدس</span></div>

    <script type="module" src="/src/main.tsx"></script>
