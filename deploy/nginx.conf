# Place in /etc/nginx/conf.d/bible.conf and add a certificate (certbot --nginx -d bible.example.com).
# Per-client request rate (one zone for the whole site). Adjust to your traffic.
limit_req_zone $binary_remote_addr zone=bible:10m rate=20r/s;

server {
    listen 80;
    server_name bible.example.com;
    client_max_body_size 64k;

    location / {
        limit_req zone=bible burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # exactly one hop: use with TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                              # lets the AI answer stream word by word
        proxy_read_timeout 90s;
    }
}
